name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Init Capacitor & Install Native Alarm Plugin
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/splash-screen @capacitor/status-bar
        npm install @pictalk-speech-made-easy/alarm
        mkdir www
        cp index.html www/
        npx cap init "The System" "com.ayoub.thesystem" --web-dir=www
        
        cat <<EOT > capacitor.config.json
        {
          "appId": "com.ayoub.thesystem",
          "appName": "The System",
          "webDir": "www",
          "plugins": {
            "SplashScreen": {
              "launchShowDuration": 1000,
              "backgroundColor": "#08080a",
              "androidScaleType": "CENTER_CROP"
            }
          }
        }
        EOT

        npx cap add android
        npx cap sync

    - name: Inject Native Alarm Permissions & Full Screen
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        sed -i '/<application>/i \
            <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" /> \
            <uses-permission android:name="android.permission.USE_EXACT_ALARM" /> \
            <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" /> \
            <uses-permission android:name="android.permission.WAKE_LOCK" /> \
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" /> \
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" /> \
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" /> \
            <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />' $MANIFEST

        STYLES="android/app/src/main/res/values/styles.xml"
        sed -i 's|<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">|<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowDrawsSystemBarBackgrounds">true</item>\n        <item name="android:windowTranslucentStatus">true</item>\n        <item name="android:windowTranslucentNavigation">true</item>|' $STYLES

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TheSystem-Final-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
