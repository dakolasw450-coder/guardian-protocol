name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Init Capacitor & Install Plugins
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/splash-screen @capacitor/status-bar @capacitor/assets @capacitor/camera
        npm install @pictalk-speech-made-easy/alarm
        mkdir www
        cp index.html www/
        npx cap init "The System" "com.ayoub.thesystem" --web-dir=www
        
        cat <<EOT > capacitor.config.json
        {
          "appId": "com.ayoub.thesystem",
          "appName": "The System",
          "webDir": "www",
          "plugins": {
            "SplashScreen": {
              "launchShowDuration": 1000,
              "backgroundColor": "#08080a",
              "androidScaleType": "CENTER_CROP"
            }
          }
        }
        EOT

        npx cap add android
        npx cap sync

    - name: Generate App Icon from icon.png
      run: |
        mkdir -p assets
        cp icon.png assets/icon.png
        npx @capacitor/assets generate --android --iconBackgroundColor '#08080a' --splashBackgroundColor '#08080a'

    - name: Apply Immersive Mode (Hide Nav Bar)
      run: |
        MAIN_ACTIVITY="android/app/src/main/java/com/ayoub/thesystem/MainActivity.java"
        cat <<EOT > $MAIN_ACTIVITY
        package com.ayoub.thesystem;

        import android.os.Bundle;
        import androidx.core.view.WindowCompat;
        import androidx.core.view.WindowInsetsCompat;
        import androidx.core.view.WindowInsetsControllerCompat;
        import com.getcapacitor.BridgeActivity;

        public class MainActivity extends BridgeActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                hideSystemBars();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
                super.onWindowFocusChanged(hasFocus);
                if (hasFocus) {
                    hideSystemBars();
                }
            }

            private void hideSystemBars() {
                WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                if (controller != null) {
                    controller.hide(WindowInsetsCompat.Type.systemBars());
                    controller.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                }
            }
        }
        EOT

    - name: Inject All Permissions (Media, Files, Alarm, Full Screen)
      run: |
        python3 - <<'PY'
        p = "android/app/src/main/AndroidManifest.xml"
        s = open(p, encoding="utf8").read()
        perms = [
          "CAMERA", "RECORD_AUDIO", "MODIFY_AUDIO_SETTINGS",
          "READ_MEDIA_IMAGES", "READ_MEDIA_VIDEO", "READ_MEDIA_AUDIO",
          "SCHEDULE_EXACT_ALARM", "USE_EXACT_ALARM", "USE_FULL_SCREEN_INTENT",
          "WAKE_LOCK", "FOREGROUND_SERVICE", "POST_NOTIFICATIONS",
          "RECEIVE_BOOT_COMPLETED", "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS",
        ]
        add = "".join(f'    <uses-permission android:name="android.permission.{x}" />\n' for x in perms)
        add += '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n'
        add += '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n'
        add += '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
        add += '    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n'
        assert "</manifest>" in s, "closing manifest tag not found"
        s = s.replace("</manifest>", add + "</manifest>")
        open(p, "w", encoding="utf8").write(s)
        PY
        echo "uses-permission count:"
        grep -c "uses-permission" android/app/src/main/AndroidManifest.xml

        STYLES="android/app/src/main/res/values/styles.xml"
        sed -i 's|<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">|<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowDrawsSystemBarBackgrounds">true</item>\n        <item name="android:windowTranslucentStatus">true</item>\n        <item name="android:windowTranslucentNavigation">true</item>|' $STYLES

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TheSystem-Final-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
